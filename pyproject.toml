[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serverwatcher"
version = "0.0.0"
description = "A HungerLib-powered Minecraft server automation engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "iFamished" }
]

keywords = [
    "pterodactyl",
    "minecraft",
    "automation",
    "rcon",
    "server-management",
    "hungerlib",
    "hungernet"
]

dependencies = [
    "requests",
    "mcrcon",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/iFamishedX/ServerWatcher"
Documentation = "https://github.com/iFamishedX/ServerWatcher"
Source = "https://github.com/iFamishedX/ServerWatcher"
Issues = "https://github.com/iFamishedX/ServerWatcher/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
serverwatcher = ["defaultconfigs/*.yaml"]