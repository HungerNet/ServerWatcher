[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serverwatcher"
version = "0.0.0"
description = "A HungerLib-powered Minecraft server automation engine."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0" }

authors = [
    { name = "iFamished" }
]

keywords = [
    "pterodactyl",
    "minecraft",
    "automation",
    "rcon",
    "server-management",
    "hungerlib",
    "hungernet"
]

dependencies = [
    "requests",
    "mcrcon",
    "hungerlib>=3.1",
    "PyYaml",
    "mapres",
    "cmd2",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/iFamishedX/ServerWatcher"
Documentation = "https://github.com/iFamishedX/ServerWatcher"
Source = "https://github.com/iFamishedX/ServerWatcher"
Issues = "https://github.com/iFamishedX/ServerWatcher/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
serverwatcher = ["defaultconfigs/*.yaml"]